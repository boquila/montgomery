<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore YOLO26 nano detection, instance segmentation, classification, semantic segmentation, and depth privately in your browser with Rust and WebAssembly.">
  <meta name="theme-color" content="#0f1115">
  <title>Montgomery · YOLO26n demo</title>
  <link rel="icon" href="data:,">
  <link data-trunk rel="rust" data-bin="montgomery-web-demo">
  <link data-trunk rel="copy-file" href="target/models/yolo26n.bpk">
  <link data-trunk rel="copy-file" href="target/models/yolo26n-seg.bpk">
  <link data-trunk rel="copy-file" href="target/models/yolo26n-cls.bpk">
  <link data-trunk rel="copy-file" href="target/models/yolo26n-sem.bpk">
  <link data-trunk rel="copy-file" href="target/models/yolo26n-depth.bpk">
  <link data-trunk rel="copy-file" href="assets/montgomery.svg">
  <base data-trunk-public-url>
  <style>
    html{touch-action:manipulation}
    html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
    body{background:#0f1115}
    canvas{display:block;position:absolute;top:0;left:0;margin-left:auto;margin-right:auto;width:100%;height:100%;touch-action:none}
    #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f0f0f0;font:24px Ubuntu-Light,Helvetica,sans-serif;text-align:center;pointer-events:none}
    #loading p{font-size:16px}
    #loading img{display:block;width:min(292px,70vw);height:auto;margin:0 auto 28px}
    .lds-dual-ring{display:inline-block;width:24px;height:24px}
    .lds-dual-ring:after{content:" ";display:block;width:24px;height:24px;border-radius:50%;border:3px solid #fff;border-color:#fff transparent #fff transparent;animation:lds-dual-ring 1.2s linear infinite}
    @keyframes lds-dual-ring{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    noscript{position:absolute;inset:30% 10%;text-align:center}
  </style>
</head>
<body>
  <canvas id="montgomery_canvas" aria-label="Montgomery YOLO26 nano multi-task demo"></canvas>
  <div id="loading" role="status" aria-label="Loading Montgomery"><img src="montgomery.svg" alt="Montgomery" width="292" height="44"><div class="lds-dual-ring"></div></div>
  <noscript>This Rust/WebAssembly inference demo requires JavaScript and WebGL.</noscript>
</body>
</html>
