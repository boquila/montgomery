[package]
name = "montgomery-web-demo"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "montgomery-web-demo"

[dependencies]
montgomery = { path = "../..", default-features = false, features = ["pretrained"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Response"] }

[profile.release]
opt-level = 3
lto = "thin"
