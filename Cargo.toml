[package]
name = "montgomery"
version = "0.1.0"
edition = "2024"
description = "Native YOLO inference and training in Rust with Burn"
license = "AGPL-3.0"
repository = "https://github.com/boquila/montgomery"
homepage = "https://github.com/boquila/montgomery"
readme = "README.md"
keywords = ["computer-vision", "yolo", "burn", "inference", "training"]
categories = ["computer-vision", "science"]

[features]
default = ["pretrained", "onnx"]
pretrained = ["dep:burn-store", "dep:ciborium", "dep:sha2"]
# Offline ONNX production is a Rust-to-SafeTensors-to-Python bridge. The feature adds no runtime
# dependency to ONNX consumers; it only exposes the exporter and its CLI orchestration.
onnx = ["pretrained"]
gpu = ["burn/wgpu", "dep:burn-wgpu", "burn-wgpu/vulkan", "burn-wgpu/webgpu", "burn-wgpu/metal"]
training = [
    "pretrained",
    "gpu",
    "burn/autodiff",
    "burn/dataset",
    "burn/train",
    "dep:rand",
    "dep:rand_chacha",
    "dep:serde_yaml",
    "dep:sha2",
]
# Experimental CPU configurations retained for backend measurements; neither changes the default path.
# burn-flex's default features already include simd (macerator/gemm) and rayon; x86-v4 adds the
# AVX-512 codegen paths of the gemm crate on top.
cpu-simd = ["burn-flex/simd", "burn-flex/x86-v4"]
cpu-cubecl = ["burn/cpu", "dep:burn-cpu"]

[dependencies]
burn = { version = "=0.21.0-pre.4", default-features = false }
burn-cpu = { version = "=0.21.0-pre.4", optional = true }
burn-flex = "=0.21.0-pre.4"
burn-store = { version = "=0.21.0-pre.4", default-features = false, features = ["std", "pytorch", "burnpack", "memmap"], optional = true }
burn-wgpu = { version = "=0.21.0-pre.4", optional = true }
ciborium = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"] }
fast_image_resize = { version = "=6.0.0", features = ["image"] }
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
itertools = { version = "0.14", default-features = false, features = ["use_alloc"] }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }

[[bin]]
name = "montgomery"
path = "src/main.rs"
required-features = ["pretrained"]
