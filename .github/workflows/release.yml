name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep local release builds fast. Distribution builds pay for maximum optimization here only.
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: montgomery
            platform: linux
            arch: x86_64
            package: montgomery-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: montgomery.exe
            platform: windows
            arch: x86_64
            package: montgomery-windows-x86_64.zip
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: montgomery
            platform: macos
            arch: arm64
            package: montgomery-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build optimized release
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.artifact }} --help

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -Destination package/
          Copy-Item -LiteralPath LICENSE, README.md -Destination package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.package }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" package/
          cp LICENSE README.md package/
          chmod +x "package/${{ matrix.artifact }}"
          tar czf "${{ matrix.package }}" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.package }}" --clobber
